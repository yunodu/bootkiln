[package]
name = "bootkiln-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bootkiln"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
bootkiln-core = { path = "../bootkiln-core" }
bootkiln-platform = { path = "../bootkiln-platform" }
bootkiln-catalog = { version = "0.1.0", path = "../bootkiln-catalog" }
