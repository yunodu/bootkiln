name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the Cargo version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version" }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/bootkiln-gui/package-lock.json

      - name: Tests
        working-directory: crates/bootkiln-gui
        run: |
          npm ci
          npm run build
          cargo test --locked

      - name: Build the GUI
        working-directory: crates/bootkiln-gui
        run: npx tauri build --no-bundle

      - name: Build the CLI
        run: cargo build --release --locked -p bootkiln-cli

      - name: Collect files and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bootkiln-gui.exe dist/
          Copy-Item target/release/bootkiln.exe dist/
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version" }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $section = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $section | Set-Content -Encoding utf8 notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/bootkiln-gui.exe
            dist/bootkiln.exe
            dist/SHA256SUMS.txt
