name: Release

# Push a tag like v0.1.0 (matching the version in Cargo.toml) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the Cargo version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version" }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/bootkiln-gui/package-lock.json

      - name: Tests
        working-directory: crates/bootkiln-gui
        run: |
          npm ci
          npm run build
          cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked -p bootkiln-cli
          cd crates/bootkiln-gui
          npx tauri build --no-bundle

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/bootkiln-gui.exe dist/
          Copy-Item target/release/bootkiln.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # The oldest supported Ubuntu: the AppImage runs on systems with this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/bootkiln-gui/package-lock.json

      - name: Tests
        working-directory: crates/bootkiln-gui
        run: |
          npm ci
          npm run build
          cargo test --locked

      # The AppImage bundles the CLI as its privileged write helper, so build it first.
      - name: Build
        run: |
          cargo build --release --locked -p bootkiln-cli
          cd crates/bootkiln-gui
          npx tauri build

      - name: Collect
        run: |
          mkdir dist
          cp target/release/bundle/appimage/*.AppImage "dist/bootkiln-${GITHUB_REF_NAME#v}-x86_64.AppImage"
          cp target/release/bootkiln dist/bootkiln-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $version" >&2; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
