[workspace]
resolver = "3"
members = ["crates/bootkiln-core", "crates/bootkiln-platform", "crates/bootkiln-catalog", "crates/bootkiln-cli", "crates/bootkiln-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yunodu/bootkiln"

[profile.release]
lto = true
codegen-units = 1
